# The two accounts the native Enclave needs, made by systemd-sysusers (up.sh step_host_accounts).
# `ekka` runs the Enclave: uid 2000, its own group, no shell. It is NEVER in docker or sudo.
# `openshell` is a GROUP only: the Enclave joins it through the unit's SupplementaryGroups=, and NVIDIA's
# gateway container joins it through compose `group_add`, so the two share the interceptor socket and
# nothing else. Its gid is whatever the system hands out; up.sh records it in up.env as DESKS_OPENSHELL_GID.
g ekka -
u ekka 2000:ekka "EKKA Enclave" /var/lib/ekka /usr/sbin/nologin
g openshell -
