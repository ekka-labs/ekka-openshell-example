# Folders the native Enclave and the gateway share, made at boot and by up.sh (systemd-tmpfiles --create).
# tmpfiles, not RuntimeDirectory=: a RuntimeDirectory is REMOVED when the unit stops, and a bind mount the
# gateway container holds on it would then point at a deleted folder, never seeing the socket made again.
# Never cleaned (the trailing `-`): nothing here ages out.
d /var/lib/ekka            0755 root root     -
d /var/lib/ekka/.ekka      0700 ekka ekka     -
d /run/ekka                0750 ekka openshell -
d /run/ekka-backend        0700 ekka ekka     -
d /etc/ekka                0755 root root     -
