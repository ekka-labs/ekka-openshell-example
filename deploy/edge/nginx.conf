# This setup's edge in front of Keycloak. TLS ends here.
# Public listener: only the paths Keycloak's reverse-proxy guide says to expose
# (keycloak.org/server/reverseproxy): the desks realm, /resources/ and /.well-known/.
# /admin/, /realms/master/, /metrics, /health and / are never reachable from outside.
# Admin listener: everything, published on 127.0.0.1 only, for setup and an administrator on this machine.
pid /tmp/nginx.pid;
events {}
http {
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;
  server_tokens off;
  access_log /dev/stdout;
  ssl_certificate     /tls/edge/tls.crt;
  ssl_certificate_key /tls/edge/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  proxy_set_header Host              $host;
  proxy_set_header X-Forwarded-Host  $host;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Port  $server_port;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_buffer_size 16k;
  proxy_buffers 8 16k;


  server {
    listen 443 ssl;    # 443 inside too, so the issuer URL is identical from every side
    location /realms/ekka-desks/clients-registrations/ { return 404; }   # no dynamic client registration
    location /realms/ekka-desks/ { proxy_pass http://keycloak:8080; }
    location /resources/       { proxy_pass http://keycloak:8080; }
    location /.well-known/     { proxy_pass http://keycloak:8080; }
    location /                 { return 404; }
  }
  server {
    listen 9443 ssl;
    location / { proxy_pass http://keycloak:8080; proxy_set_header X-Forwarded-Port 8443; }
  }
}
