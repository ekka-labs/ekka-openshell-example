# The offline tests on every push and pull request: Python 3's standard library only, nothing installed.
# They check this repository's own files (provider profiles, pins), not OpenShell, EKKA or a model.
name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true
      - name: The offline suite
        run: python3 -m unittest discover -s tests -v
  unittest-python39:
    # The same suite on Amazon Linux 2023's own python3, which is 3.9 (a supported server, README). The gateway
    # preflight once imported tomllib (3.11+) and so could not start a gateway there at all.
    # openssl, because the minimal image lacks it while every server has it (certs.sh makes the CA with it), and
    # the people bundle's trust-ca.sh prints the CA's fingerprint with it (tests/test_trust_ca.py, #168).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true
      - name: The offline suite on Amazon Linux 2023's Python 3.9
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD":/kit:ro -w /kit \
            public.ecr.aws/amazonlinux/amazonlinux@sha256:c07ab0773eddf9449c0994a87d8148300db98bdf8d8dad672a9dc26321c104fc \
            sh -c 'dnf install -q -y git-core openssl && git config --global --add safe.directory /kit \
                   && python3 --version && python3 -m unittest discover -s tests'
  pins:
    # NVIDIA signs neither the gateway nor the supervisor image, so this setup pins the binary: the committed
    # sha256 in deploy/pins.json must equal the binary in NVIDIA's checksummed release tarball AND the
    # binary inside the pinned image. Online on purpose; setup itself compares only against committed values.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: true
      - name: The committed pins match NVIDIA's release and the pinned images
        run: python3 tools/verify_pins.py --online --images
      - name: The pinned backend adapter is signed by its release workflow, as up.sh checks it at install
        # The same check as up.sh's step_backend_image, from the same values (tools/backend_image.py), with no
        # registry login: a pin that is not a signed ekka-labs release fails here, not on a customer's machine.
        run: |
          docker run --rm "$(python3 tools/backend_image.py cosign-image)" verify \
            --certificate-identity-regexp "$(python3 tools/backend_image.py identity)" \
            --certificate-oidc-issuer "$(python3 tools/backend_image.py issuer)" \
            "$(python3 tools/backend_image.py image)" >/dev/null
